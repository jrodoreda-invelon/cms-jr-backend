[project]
name = "cms-jr-backend"
version = "0.1.0"
description = "Django CMS Backend for Invelon Internship"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.4",
    "djangorestframework>=3.15.0",
    "django-filter>=24.3",
    "django-cors-headers>=4.6.0",
    "dj-database-url>=2.2.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
]

[tool.ruff]
# Ignoramos RUF012 porque Django y DRF usan atributos de clase mutables por diseño (fields, permission_classes, etc.)
lint.ignore = ["RUF012"]